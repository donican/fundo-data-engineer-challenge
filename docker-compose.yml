services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pipeline:
    build: .
    container_name: pipeline
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: 1433
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-master}
      SQLSERVER_USER: ${SQLSERVER_USER:-sa}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD}
      DUCKDB_PATH: /app/data/warehouse.duckdb
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./sql:/app/sql

volumes:
  sqlserver_data: